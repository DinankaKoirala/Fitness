<!doctype html><html><head><meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="stylesheet" href="maplibre-gl.css"><style>html,body,#map{margin:0;width:100%;height:100%;background:#12151a}#status{position:absolute;top:8px;left:8px;color:white;background:#12151acc;padding:8px;font:13px sans-serif;z-index:2}</style></head>
<body><div id="map"></div><div id="status">Loading elevation terrain…</div><script src="maplibre-gl.js"></script><script>
let map;
window.initTerrain=function(config){
 if(map)map.remove();
 try{
  map=new maplibregl.Map({container:'map',style:config.style,center:config.center,zoom:14,pitch:60,maxPitch:75,attributionControl:true,fadeDuration:0,
   transformRequest:(url)=>({url,cache:'no-store'})});
  map.addControl(new maplibregl.NavigationControl({visualizePitch:true}));
  map.on('load',()=>{
   map.addSource('elevation',{type:'raster-dem',url:'https://api.maptiler.com/tiles/terrain-rgb-v2/tiles.json?key='+encodeURIComponent(config.key),tileSize:256,encoding:'mapbox',maxzoom:14});
   map.setTerrain({source:'elevation',exaggeration:1});
   document.getElementById('status').textContent='Elevation tiles · © MapTiler';
  });
  map.on('error',()=>{document.getElementById('status').textContent='Terrain unavailable. Check connection, key and provider plan.'});
 }catch(e){document.getElementById('status').textContent='3D terrain needs a supported WebGL WebView. The native map remains available.'}
};
window.terrainCursor=function(value){
 if(!map||!map.isStyleLoaded())return;
 const source=map.getSource('cursor');if(source)source.setData(value?{type:'Point',coordinates:[value.lon,value.lat]}:{type:'FeatureCollection',features:[]});
 if(value&&value.follow)map.easeTo({center:[value.lon,value.lat],pitch:60,duration:250});
};
</script></body></html>
